<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EE Global Tracker | IIEST Shibpur</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0f1d; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; border-radius: 12px; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURATION ---
        // Replace these with your actual Supabase project credentials
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const App = () => {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [tasks, setTasks] = useState([]);
            const [profile, setProfile] = useState({ streak: 0 });
            const [loading, setLoading] = useState(true);

            // 1. Handle Auth State
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                });
                return () => subscription.unsubscribe();
            }, []);

            // 2. Load Data when User Logs In
            useEffect(() => {
                if (user) {
                    fetchData();
                }
            }, [user]);

            const fetchData = async () => {
                setLoading(true);
                // Fetch Profile (Streak)
                let { data: prof } = await supabase.from('profiles').select('*').single();
                if (prof) setProfile(prof);

                // Fetch Tasks
                let { data: t } = await supabase.from('tasks').select('*').order('created_at', { ascending: true });
                setTasks(t || []);
                setLoading(false);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
            };

            const handleSignup = async (e) => {
                e.preventDefault();
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) alert("Check your email for confirmation!");
            };

            const toggleTask = async (id, currentStatus) => {
                const { error } = await supabase
                    .from('tasks')
                    .update({ completed: !currentStatus })
                    .eq('id', id);
                if (!error) fetchData();
            };

            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-6">
                        <div className="glass p-8 w-full max-w-md">
                            <h2 className="text-2xl font-bold mb-6 text-cyan-400 mono">EE_PORTAL_AUTH</h2>
                            <form className="space-y-4">
                                <input className="w-full bg-slate-900 p-3 rounded border border-slate-700" type="email" placeholder="Email" onChange={e => setEmail(e.target.value)} />
                                <input className="w-full bg-slate-900 p-3 rounded border border-slate-700" type="password" placeholder="Password" onChange={e => setPassword(e.target.value)} />
                                <div className="flex gap-4 pt-4">
                                    <button onClick={handleLogin} className="flex-1 bg-cyan-600 p-3 rounded font-bold">Login</button>
                                    <button onClick={handleSignup} className="flex-1 bg-slate-700 p-3 rounded font-bold">Sign Up</button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <header className="glass p-6 mb-8 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold text-cyan-400 mono">IIEST_CLOUD_SYNC_V1</h1>
                            <p className="text-xs text-slate-500">{user.email}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-2xl font-bold text-amber-500">🔥 {profile.streak}</p>
                            <button onClick={() => supabase.auth.signOut()} className="text-[10px] uppercase text-slate-500 hover:text-white">Logout</button>
                        </div>
                    </header>

                    {loading ? (
                        <div className="text-center mono animate-pulse">FETCHING_FROM_DATABASE...</div>
                    ) : (
                        <div className="space-y-4">
                            <h3 className="font-bold text-slate-400 uppercase text-xs tracking-widest">Active Tasks</h3>
                            {tasks.length === 0 && <p className="text-slate-600 italic">No tasks found. Add some in Supabase Dashboard!</p>}
                            {tasks.map(task => (
                                <div key={task.id} className="glass p-4 flex items-center gap-4 transition-all hover:border-cyan-900">
                                    <input 
                                        type="checkbox" 
                                        checked={task.completed} 
                                        onChange={() => toggleTask(task.id, task.completed)}
                                        className="w-5 h-5 accent-cyan-500"
                                    />
                                    <span className={`flex-1 ${task.completed ? 'line-through text-slate-600' : ''}`}>{task.text}</span>
                                    <span className="text-[10px] mono bg-slate-800 px-2 py-1 rounded text-cyan-400">{task.tag}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
